name: CI

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t spam-digest:ci .

      - name: Simulate a data volume written by an older (root) image
        run: |
          docker volume create sd_data
          docker run --rm --user 0 --entrypoint /bin/sh -v sd_data:/data spam-digest:ci \
            -c 'echo "{}" > /data/spam_digest_last_run.json && chmod 644 /data/spam_digest_last_run.json && chown 0:0 /data /data/spam_digest_last_run.json && ln -s /app/status_server.py /data/planted.json'

      - name: Start container
        run: |
          docker run -d --name sd -p 8080:8080 -v sd_data:/data \
            -e IMAP_SERVER=imap.invalid -e EMAIL_USER=ci@example.com -e EMAIL_PASS=x \
            -e SMTP_HOST=smtp.invalid -e RUN_ON_START=true \
            spam-digest:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/ && break
            sleep 1
          done
          curl -fsS -o /dev/null -w "dashboard HTTP %{http_code}\n" http://127.0.0.1:8080/

      - name: Check processes, files and cron job
        run: |
          # -i is required: without it docker exec gives python an empty
          # stdin and the check silently does nothing. The grep below makes
          # the step fail unless the script really ran to the end.
          docker exec -i sd python3 - > check.log 2>&1 <<'PY' || { cat check.log; exit 1; }
          import os, pwd, stat

          procs = {}
          me = str(os.getpid())
          for pid in filter(str.isdigit, os.listdir("/proc")):
              if pid == me:
                  continue  # this checker runs via docker exec as root
              try:
                  cmd = open(f"/proc/{pid}/cmdline", "rb").read().replace(b"\0", b" ").decode().strip()
                  uid = next(int(l.split()[1]) for l in open(f"/proc/{pid}/status") if l.startswith("Uid:"))
              except (OSError, StopIteration):
                  continue
              if cmd:
                  procs[cmd] = pwd.getpwuid(uid).pw_name
          for cmd, user in sorted(procs.items()):
              print(f"{user:6} {cmd}")

          server = [u for c, u in procs.items() if "status_server.py" in c]
          assert server == ["app"], f"web server must run as app: {server}"
          cron = [u for c, u in procs.items() if c.startswith("cron")]
          assert cron == ["root"], f"cron should be the only root service: {cron}"
          root_procs = sorted(c for c, u in procs.items() if u == "root")
          assert all(c.startswith("cron") for c in root_procs), f"unexpected root processes: {root_procs}"
          assert not [c for c, u in procs.items() if u == "root" and "python" in c], "no python as root"

          st = os.stat("/data")
          assert pwd.getpwuid(st.st_uid).pw_name == "app" and stat.S_IMODE(st.st_mode) == 0o700, "/data owner/mode"
          for name in os.listdir("/data"):
              p = os.path.join("/data", name)
              assert pwd.getpwuid(os.lstat(p).st_uid).pw_name == "app", f"{p} not owned by app"
          legacy = os.stat("/data/spam_digest_last_run.json")
          assert stat.S_IMODE(legacy.st_mode) == 0o600, "legacy state file not tightened"

          # The root-run startup must not have followed the planted symlink.
          script = os.stat("/app/status_server.py")
          assert stat.S_IMODE(script.st_mode) == 0o644 and script.st_uid == 0, "symlink was followed"
          assert os.path.islink("/data/planted.json")

          env = os.stat("/tmp/container_env.sh")
          assert pwd.getpwuid(env.st_uid).pw_name == "app" and stat.S_IMODE(env.st_mode) == 0o600, "env dump perms"
          print("processes and permissions OK")
          PY
          cat check.log
          grep -q "processes and permissions OK" check.log
          docker exec sd crontab -l | tee /dev/stderr | grep -q "setpriv --reuid=app --regid=app --init-groups"

      - name: Run a digest as the cron job would
        run: |
          # Fails to reach the (invalid) IMAP server, but must not hit any
          # permission error on /data or the env file.
          docker exec sd setpriv --reuid=app --regid=app --init-groups /bin/bash -c \
            'source /tmp/container_env.sh && python3 /app/spam_digest.py --force-send' 2>&1 | tee digest.log || true
          ! grep -qi "permission denied" digest.log
          docker exec sd python3 -c "import json; json.load(open('/data/spam_digest_last_run.json'))"

      - name: Container logs
        if: always()
        run: docker logs sd 2>&1 | tail -50
